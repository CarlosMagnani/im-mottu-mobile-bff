version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: im-mottu-mobile-bff
    ports:
      - "${NODE_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 